[workspace]
members = ["crates/intent-llm", "crates/intent-graph"]

[package]
name = "qtcloud-think-intent"
version = "0.1.0"
edition = "2021"
description = "GraphRAG scaffold CLI for intent-aware thinking"

[dependencies]
intent-llm = { path = "crates/intent-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qtcloud-think-intent"
path = "src/main.rs"
