[workspace]
members = ["crates/llm", "crates/core"]

[package]
name = "qtcloud-think-intent"
version = "0.1.0"
edition = "2021"
description = "GraphRAG scaffold CLI for intent-aware thinking"

[dependencies]
situation-graph = { path = "crates/core" }
llm = { path = "crates/llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qtcloud-think-intent"
path = "src/main.rs"
