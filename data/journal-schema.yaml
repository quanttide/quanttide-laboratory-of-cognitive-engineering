schemas:
- usage: 适用于认知工程方法论建设和工具设计，在需要理解人类意图→结构化知识转化过程时参考
  entities:
  - name: 意图
    attributes:
    - 所有结构化产出的起点
    - 从模糊走向清晰
    - 认知工程的核心驱动
  - name: 人机辩论
    attributes:
    - 人类反馈打破AI局部最优
    - 辩论收敛
    - 章程是辩论的自然产出
  - name: 契约
    attributes:
    - 意图的结构化表达
    - 可计算、可传递、可验证
    - 意图到工程的转化载体
  - name: D-V-C-E闭环
    attributes:
    - 发现→验证→契约→执行
    - 意图工程的操作化表达
    - 方法论从概念走向可操作
  causals:
  - condition: 单一AI自收敛存在局限性，缺乏外部校准
    outcome: 需要建立人机协同的反思与辩论模型
    type: 保留
    note: 跨组织通用的人机协同局限——任何AI系统在无外部反馈时都会陷入局部最优
  - condition: 人类反馈打破AI局部最优
    outcome: 辩论收敛，产出章程类结构化知识
    type: 保留
    note: 这是人机辩论的核心因果链，在W19-W23跨周验证稳定
  - condition: 所有结构化产出的起点都是意图
    outcome: 认知工程的核心任务是让意图可计算、可传递、可验证
    type: 保留
    note: 意图工程的基础假设，在W21-W23持续强化
  - condition: 契约结构在多个场景验证有效
    outcome: 意图工程方法论具有深化和推广的基础
    type: 需验证
    verify: 确认"多个场景"至少覆盖3个不同领域（如写作、产品、基础设施）
  - condition: D-V-C-E闭环形成
    outcome: 意图工程从理论概念走向可操作的方法论
    type: 保留
    note: D-V-C-E是意图工程的操作化表达，在W22首次提出后持续验证
  - condition: 概念体系庞杂，全面学习导致认知混乱
    outcome: 需要面向需求学而非全面学
    type: 保留
    note: 以问题为锚点组织知识，通用的认知策略
  - condition: 自然语言描述认知结构不够精确
    outcome: 需要引入形式化工具（如范畴论）辅助建模
    type: 需验证
    verify: 团队是否具备形式化工具的基础理解（范畴论/类型论等）
  - condition: 过度形式化，追求精确性而牺牲探索空间
    outcome: 形式化工具变成约束而非助力
    type: 保留
    note: 形式化与灵活性的张力是通用工程教训
  boundaries:
  - 适用于认知工程领域的方法论建设和工具设计
  - 假设人机协作为主要工作模式，不覆盖纯人工或纯自动化场景
  - 不适用于已成熟定型的工程领域（如传统软件工程）
  - 不覆盖意图的伦理审核或社会影响评估等外部治理环节
  - 假设使用者具备基本认知工程概念
  properties:
  - key: 理论根基
    value: 二阶控制论（观察者参与系统、自我指涉循环）
  - key: 方法论核心
    value: 意图工程——以意图为所有结构化产出的起点
  - key: 实践模式
    value: 人机协同反思与辩论
  - key: 工程范式
    value: 意图 → 契约 → 结构化产出
  - key: 形式化原则
    value: 在实践中提取理论，在适度形式化与探索灵活性之间平衡
  dynamics:
  - key: 方法论成熟度
    value: 从模糊的概念探索（W19）→ 范畴论形式化尝试（W21）→ D-V-C-E闭环形成（W22）→ 人机辩论模型验证（W23）
  - key: 核心焦点
    value: 从"认知工程是什么"到"意图工程怎么做"——从理论探索到可操作方法论
  - key: 工具化程度
    value: 从不依赖工具到意图→契约管线逐步建立
  mappings:
  - intent: 建立人机协同的反思与辩论模型
    action: 引入人类反馈机制，设计双向辩论流程，以章程为辩论目标
    type: 保留
  - intent: 深化意图工程方法论
    action: 系统化D-V-C-E闭环，建立从意图到契约的完整转化管线
    type: 保留
  - intent: 用形式化工具建模认知结构
    action: 运用范畴论的映射与组合概念辅助建模，保持实践→理论→实践的节奏
    type: 需验证
    caution: 确认团队对形式化工具的基础理解后再启动
    verify: 团队是否具备基础范畴论概念
  - intent: 面向需求组织知识而非全面学习
    action: 以实际问题为锚点，组织相关概念和工具
    type: 保留
  biases:
  - belief: 好的设计在自然演化中自然形成，不需要刻意设计
    fact: 好的设计需要在自然演化与主动设计之间取得平衡——演化提供素材，设计提供方向
    type: 保留—工程偏见
  - belief: 形式化程度越高越好，精确的数学描述能完全捕捉认知结构
    fact: 过度形式化会扼杀探索空间——形式化与灵活性需要平衡，在实践中提取理论而非学完理论再实践
    type: 保留—工程偏见
  - belief: 认为意图是模糊不可操作的哲学概念
    fact: 意图可以通过契约结构变得可计算、可传递、可验证——模糊性不是缺陷而是核心问题
    type: 保留—方法论偏见
  - belief: 认为方法论的深化需要追求理论完备后才能推广
    fact: 方法论的深化与场景验证是并行过程——契约结构在多个场景验证有效本身就是驱动力
    type: 保留—工程偏见
