schemas:
- usage: 适用于外部咨询团队向创始人型组织交付认知工程咨询服务的通用图式
  entities:
  - name: 咨询阶段
    attributes:
    - 准入诊断
    - 认知对齐
    - 方案共创
    - 交付执行
    - 治理移交
  - name: 方案选型
    attributes:
    - 最小可行
    - 标准方案
    - 定制方案
  - name: 交付机制
    attributes:
    - 决策记录
    - 进度同步
    - 风险看板
    - 验收标准
  - name: 信任信号
    attributes:
    - 早期可验证产出
    - 问题响应时效
    - 知识移交件
  causals:
  - condition: 未经准入诊断直接入场
    outcome: 客户条件不匹配，方案无法落地
  - condition: 客户未完成认知对齐
    outcome: 用旧思维理解新方案，方向偏离
  - condition: 咨询方无实际决策权且未建立信任
    outcome: 治理机制被绕过，方案流于形式
  - condition: 连续2周无可见交付物
    outcome: 客户信任归零，项目进入危机
  - condition: 交付物可量化可验证
    outcome: 客户愿意为抽象经验付费
  - condition: 触发明确定的熔断红线
    outcome: 执行回退路径，止损并复盘
  - condition: 知识移交件完整
    outcome: 客户团队可独立运维
  boundaries:
  - 适用于有明确问题但无明确解法的创始人型客户
  - 排除客户自身无决策权的驻场外包场景
  - 排除已有成熟方法论且仅需执行力的场景
  - 需要客户创始人或CTO作为直接对接人
  - 需要客户愿为前期诊断付费
  properties:
  - key: 交付模式
    value: 分阶段交付，每阶段有验收节点
  - key: 推荐起始方案
    value: 最小可行方案，验证后升级
  - key: 方案升级触发
    value: 第三个同类约束出现
  - key: 最小交付周期
    value: 2周出第一个可验证交付物
  - key: 总周期
    value: 2-4个月，按月续约
  dynamics:
  - key: 客户信任度
    value: 前2周最低，第一个交付物后回升
  - key: 方案成熟度
    value: 随交付件迭代递增
  - key: 顾问决策影响力
    value: 从零开始，随信任积累上升
  - key: 回退概率
    value: 前2周最高，认知对齐后递减
  mappings:
  - intent: 甄别客户是否适合此方法
    action: 准入诊断（条件清单 + 30分钟访谈）
  - intent: 防止客户用旧思维理解新方案
    action: 认知对齐工作坊 + 最小POC
  - intent: 在无决策权的情况下推动决策
    action: 用交付物说话，而非用规范要求
  - intent: 维持客户信任
    action: 每2周一个可展示的交付件
  - intent: 将隐性知识转化为可收费的交付物
    action: 每阶段产出标准化工件（schema/ADR/看板/runbook）
  - intent: 防止项目脱轨导致声誉风险
    action: 预设熔断红线 + 量化回退触发条件
  - intent: 让客户在退场后能独立运作
    action: 知识移交件（图式+决策日志+治理手册）
  biases:
  - id: 00000002-0001-0001-0001-000000000001
    belief: 客户知道自己要什么
    fact: 客户知道问题但不知道解法，咨询服务是帮他们找到解法而非执行指令
  - id: 00000002-0001-0001-0001-000000000002
    belief: 方案越完整客户越买单
    fact: 客户为"可见的进展"付费，而非为"完整的设计"付费
  - id: 00000002-0001-0001-0001-000000000003
    belief: 顾问有决策权才能推动
    fact: 顾问用交付物影响力替代决策权，信任积累后自然获得影响力
  - id: 00000002-0001-0001-0001-000000000004
    belief: 客户要求什么就做什么
    fact: 客户提的是症状不是病因，咨询服务要诊断病因而非执行症状方案
  - id: 00000002-0001-0001-0001-000000000005
    belief: 知识移交是项目结束才做的事
    fact: 知识移交从第一天开始，每阶段交付件都是移交的一部分
  - id: 00000002-0001-0001-0001-000000000006
    belief: 只要方案正确客户就会买单
    fact: 客户信任先于方案正确，前2周不建立信任后续方案再正确也无用
