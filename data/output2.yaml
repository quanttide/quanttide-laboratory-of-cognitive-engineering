schemas:
- usage: 适用于任何存量系统的技术升级场景，从架构升级到平台迁移
  entities:
  - name: 升级阶段
    attributes:
    - 现状评估
    - 目标定义
    - 方案设计
    - 分步实施
    - 验证收尾
  - name: 升级模式
    attributes:
    - 原地升级
    - 并行运行
    - 渐进替换
    - 大爆炸
  - name: 风险维度
    attributes:
    - 技术债务
    - 数据一致性
    - 业务连续性
    - 团队能力
  - name: 回退机制
    attributes:
    - 回滚点
    - 灰度开关
    - 数据备份
  causals:
  - condition: 未完成现状评估
    outcome: 升级方案脱离实际，执行中发现未预见的阻塞
  - condition: 目标状态未量化定义
    outcome: 升级完成后无法判断是否成功
  - condition: 一次性迁移规模过大
    outcome: 风险失控，回退成本极高
  - condition: 缺少回退机制
    outcome: 升级失败后无法恢复，业务受损
  - condition: 连续灰度验证通过
    outcome: 全量切换风险可控
  - condition: 技术升级与组织转型节奏错位
    outcome: 团队抵触，升级被架空
  - condition: 假设未经POC验证
    outcome: 方案在真实环境中暴露致命缺陷
  boundaries:
  - 适用于存量系统的技术升级
  - 排除从零新建的系统
  - 排除仅需配置变更无需架构改动的场景
  - 需要"当前状态"与"目标状态"均可量化描述
  - 需要团队具备基本的工程纪律（代码管理/测试/部署流水线）
  properties:
  - key: 升级模式选择依据
    value: 根据风险容忍度与业务连续性要求选择
  - key: 推荐模式
    value: 渐进替换，每阶段可独立验证和回滚
  - key: 单阶段最大规模
    value: 应控制在可回滚的范围内，一般不超过总改动量的20%
  - key: 假设验证周期
    value: 最长2周，超过则说明假设粒度太大
  dynamics:
  - key: 升级风险
    value: 随未经验证的假设数量递增
  - key: 团队阻力
    value: 与沟通透明度和参与度负相关
  - key: 回退成本
    value: 随时间指数增长，越早回退成本越低
  mappings:
  - intent: 确保升级方案可行
    action: 现状评估 → 目标定义 → 关键假设提取 → POC验证
  - intent: 控制升级风险
    action: 分阶段实施 + 每阶段独立回滚 + 灰度切换
  - intent: 降低回退成本
    action: 预设回滚点，每阶段开始前验证回滚路径可用
  - intent: 让团队 buy-in
    action: 升级全程透明沟通，团队参与方案设计
  - intent: 验证关键假设
    action: 风险最高的假设优先POC，2周内出结论
  - intent: 避免升级拖垮业务
    action: 技术升级节奏与业务节奏对齐，设缓冲期
  biases:
  - id: 00000003-0001-0001-0001-000000000001
    belief: 新技术自然比旧技术好
    fact: 新技术带来新风险，升级的价值取决于业务需求而非技术先进性
  - id: 00000003-0001-0001-0001-000000000002
    belief: 方案越详细成功率越高
    fact: 详细方案建立在对未知的假设上，快速验证比详细规划更有效
  - id: 00000003-0001-0001-0001-000000000003
    belief: 回退机制可以上线后再补
    fact: 回退机制必须在升级执行前准备好，上线后补的成本极高
  - id: 00000003-0001-0001-0001-000000000004
    belief: 技术升级只是技术部门的事
    fact: 技术升级影响业务流程和团队结构，需要业务方参与
  - id: 00000003-0001-0001-0001-000000000005
    belief: 升级完成后就结束了
    fact: 升级后的稳定期和知识移交才是价值兑现的阶段
