schemas:
- usage: 适用于从当前状态到目标状态的技术升级咨询，涉及架构/平台/数据迁移等存量系统改造场景
  entities:
  - name: 升级阶段
    attributes:
    - 认知对齐
    - 基础设施
    - 核心改造
    - 迁移治理
    - 持续演进
  - name: 隔离模式
    attributes:
    - 逻辑隔离
    - Schema隔离
    - 实例隔离
  - name: 信任信号
    attributes:
    - 早期可验证产出
    - 交付节奏可预期
    - 问题响应时效
  causals:
  - condition: 团队未完成范式认知
    outcome: 用单租户思维做多租户改造
    type: 保留—技术本质
    note: 多租户涉及路由、隔离、数据扩散，非加字段可解决
  - condition: 连续3周无可见产出
    outcome: 团队动力归零
    type: 保留—人性规律
    note: 外部咨询信任基础更薄弱，三周交付节奏是铁律
  - condition: 第三个租户提出同类需求
    outcome: 进入下一级隔离模式
    type: 保留—工程原则
    note: YAGNI具象化，无论内外提前抽象都带来无谓复杂度
  - condition: POC验证可行
    outcome: 全面推广
    type: 保留—风险控制
    note: 外部咨询试错成本更高，POC是不变的安全阀
  - condition: 缺少回退机制
    outcome: 升级失败后无法恢复
    type: 保留—工程底线
    note: 跨越式切换在外部客户环境中几乎是自杀
  - condition: 客户对范式共识为伪共识
    outcome: 认知对齐工作坊沦为服从性表演
    type: 需验证—信任前提
    verify: 客户创始人或CTO是否亲自参与对齐
  - condition: 外部顾问引入第三方评审
    outcome: 被视为推卸责任或缺乏主见
    type: 需验证—权力结构
    verify: 客户对多重外部干预的容忍度
  - condition: 规范仅靠自然生长无底线约束
    outcome: 无尽扯皮，交付周期失控
    type: 需验证—交付约束
    verify: 客户是否有底线约束机制（验收标准/熔断红线）
  - condition: 顾问处于信息孤岛
    outcome: 无法感知客户政治博弈，升级节奏错位
    type: 需验证—信息深度
    verify: 顾问对客户组织动态的感知通道是否畅通
  boundaries:
- 适用于有明确技术升级需求但无成熟方案的存量系统
- 排除客户自身无决策权的驻场外包场景
- 排除已有成熟方案仅需执行力的场景
- 需要客户方有架构决策权的对接人
- 需要客户愿为前期诊断和认知对齐投入时间
  - 限制：图式中"需验证"类经验必须在准入期完成验证，验证不通过则需调整咨询策略或拒绝入场
  properties:
  - key: 升级模式
    value: 渐进迁移，非大爆炸重写
  - key: 推荐起始隔离
    value: 逻辑隔离共享DB
  - key: 升级触发器
    value: 第三个同类需求出现
  - key: 交付节奏
    value: 每阶段≤3周，阶段间设缓冲期
  - key: 总周期
    value: 3-4个月交付 + 持续演进
  dynamics:
  - key: 客户信任度
    value: 前2周最低，第一个交付物后回升
  - key: 隔离复杂度
    value: 随租户数量递增，按三原则触发升级
  - key: 团队认知阻力
    value: M0最大，之后递减
  - key: 顾问决策影响力
    value: 从零开始，随信任积累上升
  mappings:
  - intent: 防止团队用旧思维做新架构
    action: 认知对齐工作坊 + 最小多租户POC
    type: 保留
    caution: 工作坊需有决策权的对接人亲自参与，否则无法验证是否为伪共识
  - intent: 避免过度设计
    action: 从逻辑隔离起步，第三个租户再抽象
    type: 保留
  - intent: 维持团队动力
    action: 每阶段≤3周，阶段间设缓冲期
    type: 保留
  - intent: 不让升级成为新压力源
    action: 升级节奏与客户业务节奏对齐
    type: 需验证
    verify: 顾问是否能获取客户的业务日历和关键节点
  - intent: 架构决策可追溯
    action: 决策记录（ADR/会议纪要/决策看板）
    type: 需验证
    verify: 客户是否接受显性化决策过程，而非习惯口头默契
  - intent: 规范不阻碍实践
    action: 让规范在升级过程中自然沉淀
    type: 需验证
    verify: 客户是否有底线约束机制防止"自然生长"变成"无尽扯皮"
  - intent: 验证客户条件的匹配度
    action: 准入诊断（条件清单 + 30分钟创始人访谈）
    type: 新增
  - intent: 建立早期信任
    action: 前2周产出可展示的交付件，而非文档
    type: 新增
  - intent: 防止项目脱轨
    action: 预设熔断红线 + 量化回退触发条件
    type: 新增
  biases:
  - id: 00000002-0001-0001-0001-000000000001
    belief: 加个tenant_id就够了
    fact: 需要范式级重构
    type: 保留—技术偏见
  - id: 00000002-0001-0001-0001-000000000002
    belief: 一步到位最省事
    fact: 渐进迁移每阶段可回滚
    type: 保留—工程偏见
  - id: 00000002-0001-0001-0001-000000000003
    belief: 标准先定好再动手
    fact: 标准化在实践中自然形成，但需底线约束
    type: 需验证—组织偏见
    verify: 客户是否有能力在无预设标准下保持工程纪律
  - id: 00000002-0001-0001-0001-000000000004
    belief: 升级只是技术问题
    fact: 最大瓶颈是团队认知和客户信任
    type: 保留—人性偏见
  - id: 00000002-0001-0001-0001-000000000005
    belief: 客户知道自己要什么
    fact: 客户知道问题但不知道解法，咨询服务是诊断而非执行
    type: 新增—咨询偏见
  - id: 00000002-0001-0001-0001-000000000006
    belief: 只要方案正确客户就会买单
    fact: 客户信任先于方案正确，前2周不建立信任后续方案再正确也无用
    type: 新增—咨询偏见
