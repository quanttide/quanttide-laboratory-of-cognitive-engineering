schemas:
- usage: 适用于创始人型组织从单租户到多租户的技术升级咨询
  entities:
  - name: 升级阶段
    attributes:
    - 认知对齐
    - 基础设施
    - 核心改造
    - 迁移治理
    - 持续演进
  - name: 隔离模式
    attributes:
    - 逻辑隔离
    - Schema隔离
    - 实例隔离
  - name: 治理机制
    attributes:
    - ADR
    - 租户管理
    - 自运维
  - name: 节奏信号
    attributes:
    - 里程碑
    - 倦怠对冲
    - 缓冲期
  causals:
  - condition: 团队未完成范式认知
    outcome: 用单租户思维做多租户改造
  - condition: 连续3周无可见产出
    outcome: 团队动力归零
  - condition: 第三个租户提出同类需求
    outcome: 进入下一级隔离模式
  - condition: POC验证可行
    outcome: 全面推广
  - condition: 外部评审介入
    outcome: 打破架构思维定势
  - condition: 标准化在实践中生长
    outcome: 系统自我维护
  boundaries:
  - 适用于已有认知工程数据的创始人型组织
  - 排除纯外包团队
  - 排除无架构决策权的场景
  - 需要团队对"范式升级"达成共识
  - 需要至少运行3个月才有足够治理数据
  properties:
  - key: 升级模式
    value: 渐进迁移，非大爆炸重写
  - key: 推荐起始隔离
    value: 逻辑隔离共享DB
  - key: 升级触发器
    value: 第三个同类需求出现
  - key: 总周期
    value: 3-4个月交付 + 持续演进
  dynamics:
  - key: 隔离复杂度
    value: 随租户数量递增，按三原则触发升级
  - key: 治理成熟度
    value: 随升级过程自然递增
  - key: 团队认知阻力
    value: M0最大，之后递减
  mappings:
  - intent: 防止团队用旧思维做新架构
    action: M0认知对齐工作坊 + 最小多租户POC
  - intent: 避免过度设计
    action: 从逻辑隔离起步，第三个租户再抽象
  - intent: 维持团队动力
    action: 每阶段≤3周，阶段间设缓冲期
  - intent: 不让升级成为新压力源
    action: 升级节奏与组织转型节奏同步
  - intent: 架构决策可追溯
    action: 每项决策记录为ADR
  - intent: 规范不阻碍实践
    action: 让规范在升级过程中自然沉淀
  biases:
  - id: 00000001-0001-0001-0001-000000000001
    belief: 加个tenant_id就够了
    fact: 需要范式级重构，从数据模型到运维体系
  - id: 00000001-0001-0001-0001-000000000002
    belief: 一步到位最省事
    fact: 渐进迁移更可控，每阶段可回滚
  - id: 00000001-0001-0001-0001-000000000003
    belief: 标准先定好再动手
    fact: 标准化在实践中自然形成
  - id: 00000001-0001-0001-0001-000000000004
    belief: 升级只是技术问题
    fact: 最大瓶颈是团队认知和节奏管理
  - id: 00000001-0001-0001-0001-000000000005
    belief: 选择隔离模式一步到位
    fact: 从简起步，按三原则触发升级
  - id: 00000001-0001-0001-0001-000000000006
    belief: 招人就能加速升级
    fact: 体系化设计比堆人力更有效
  - id: 00000001-0001-0001-0001-000000000007
    belief: 验证成功等于架构可行
    fact: POC成功只是技术可行，业务价值需独立评估
