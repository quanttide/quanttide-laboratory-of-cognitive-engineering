- biases:
    事实: 某些想法无法低成本验证，或验证结果不可靠
    信念: 所有新想法都适合先验证再复制
  boundaries: 适用于商业模式探索、产品创新等需要快速试错的领域，不适用于已有成熟路径的重复性工作
  causals:
    IF 新想法经过低门槛验证可行: THEN 可以结构化复制
    IF 验证不可行: THEN 放弃或调整想法
  dynamics:
    复制速度:
      典型值: 快
    风险水平:
      典型值: 高
    验证成本:
      典型值: 低
  entities:
    POC范式:
      属性:
      - 同构于研发POC
      - 跨领域适用
    低门槛验证:
      属性:
      - 低成本
      - 快速
    新想法:
      属性:
      - 未验证
      - 高不确定性
    结构化复制:
      属性:
      - 已验证
      - 可扩展
  label: POC验证驱动复制
  mappings:
    探索可持续新商业模式: 设计低门槛验证实验
- biases:
    事实: 心理调节是基础条件，忽视会导致其他意图崩溃
    信念: 心理调节是次要的，可以等任务完成后再处理
  boundaries: 适用于高压、多任务、探索性工作场景，不适用于短期简单任务
  causals:
    IF 元意图得到维护: THEN 其他意图可持续运作
    IF 无意义感出现: THEN 需要启动对冲机制（如整合带来清晰感）
  dynamics:
    元意图优先级:
      典型值: 高
    对冲机制有效性:
      典型值: 中等
    无意义感频率:
      典型值: 反复出现
  entities:
