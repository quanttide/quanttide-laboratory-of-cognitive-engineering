- biases:
    事实: 被动防守无法应对系统性风险，需要主动设计
    信念: 备份就是最好的防守
  boundaries: 适用于多工具、多云端、复杂架构的技术环境，不适用于单机简单系统
  causals:
    IF 升级为主动设计: THEN 风险降低但可能引入过度抽象风险
    IF 采用被动防守策略: THEN 风险高（如数据丢失）
  dynamics:
    抽象程度:
      典型值: 适中
    治理成熟度:
      典型值: 从低到高
    风险水平:
      典型值: 低（主动设计后）
